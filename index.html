<!DOCTYPE html>

<title>Gallery</title>

<style>
/* Navigation Bar */
body{
font-family: Arial, sans-serif;
margin:0;
background-color:#f4f4f4;
}
nav{
background-color:#333;
padding:15px;
}
nav ul{
list-style:none;
margin:0;
padding:0;
display:flex;
}
nav ul li{
margin-right:20px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
}
nav ul li a:hover{
color:yellow;
}
/* Transformation Example */
.transform-box{
width:150px;
height:150px;
background-color:royalblue;
color:white;
text-align:center;
line-height:150px;
margin:40px auto;
transition:1s;
}
.transform-box:hover{
transform: rotate(15deg) scale(1.2) translateY(-10px);
}
/* Animation Example */
.animation-box{
width:100px;
height:100px;
background-color:crimson;
position:relative;
animation: moveBox 4s infinite;
margin:50px;
}
@keyframes moveBox{
0%{
left:0;
background-color:crimson;
}
50%{
left:300px;
background-color:gold;
}

100%{
left:0;
background-color:crimson;
}
}
</style>
</head>
